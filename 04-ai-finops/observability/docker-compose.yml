# A local OpenTelemetry trace viewer for week 4: the Aspire dashboard.
# It has no sign-in, so its ports are published on 127.0.0.1 only: other computers can't reach it.
# Start it with: docker compose up -d · Stop it with: docker compose down
# Dashboard: http://localhost:18888 · OTLP endpoint for Copilot: http://localhost:4318
services:
  aspire-dashboard:
    image: mcr.microsoft.com/aspire/dashboard:latest
    ports:
      - "127.0.0.1:18888:18888" # dashboard
      - "127.0.0.1:4317:18889"  # OTLP over gRPC
      - "127.0.0.1:4318:18890"  # OTLP over HTTP
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
