# A local OpenTelemetry trace viewer for week 4: the Aspire dashboard.
# Start it with: docker compose up -d
# Dashboard: http://localhost:18888 · OTLP endpoint for Copilot: http://localhost:4318
services:
  aspire-dashboard:
    image: mcr.microsoft.com/aspire/dashboard:latest
    ports:
      - "18888:18888" # dashboard
      - "4317:18889"  # OTLP over gRPC
      - "4318:18890"  # OTLP over HTTP
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
